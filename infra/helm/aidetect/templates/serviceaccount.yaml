apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aidetect.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  annotations:
    azure.workload.identity/client-id: {{ required "azure.backendUamiClientId is required (set via --set at deploy time)" .Values.azure.backendUamiClientId | quote }}
  labels:
    azure.workload.identity/use: "true"
    {{- include "aidetect.componentLabels" (dict "component" "backend" "top" $) | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aidetect.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidetect.componentLabels" (dict "component" "frontend" "top" $) | nindent 4 }}
