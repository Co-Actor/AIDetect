{{- if .Values.backend.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "aidetect.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aidetect.componentLabels" (dict "component" "backend" "top" $) | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "azure.backendUamiClientId is required" .Values.azure.backendUamiClientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
{{- range .Values.backend.secretEnvKeys }}
        - |
          objectName: aidetect-dev-backend-{{ . | replace "_" "-" }}
          objectAlias: {{ . }}
          objectType: secret
{{- end }}
  secretObjects:
    - secretName: {{ include "aidetect.fullname" . }}-backend-env
      type: Opaque
      data:
{{- range .Values.backend.secretEnvKeys }}
        - objectName: {{ . }}
          key: {{ . }}
{{- end }}
{{- end }}
