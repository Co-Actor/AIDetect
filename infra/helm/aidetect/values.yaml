# Default values for aidetect Helm chart.
# These are overridden by values-dev.yaml for the development environment.

nameOverride: ""
fullnameOverride: ""

# Common labels
commonLabels:
  app.kubernetes.io/part-of: aidetect

# Azure / Workload Identity
azure:
  tenantId: "126403ee-2465-4019-8431-5a17899b6774"
  keyVaultName: "kv-aidetect-dev"
  # UAMI client ID for backend service account — injected at deploy time via --set
  backendUamiClientId: ""

# Image registry — overridden per env via --set image.registry / image.tag
image:
  registry: "publoraacrdev.azurecr.io"
  pullPolicy: Always
  tag: "dev-latest"
  # Set to a docker-registry secret name only if pulling from a registry that the
  # AKS kubelet identity does NOT have access to. For publoraacrdev (attached to AKS)
  # leave empty — AcrPull on the kubelet identity is enough.
  pullSecretName: ""

# Common pod placement (default nodepool, shared dev namespace)
nodeSelector: {}
tolerations: []

backend:
  enabled: true
  name: backend
  replicas: 1
  image:
    repository: aidetect-backend
    tag: ""  # falls back to .Values.image.tag
  port: 8010
  env:
    ENVIRONMENT: "development"
    API_PORT: "8010"
    API_CORS_ORIGINS: "https://aidetect.co.actor"
    LANGFUSE_ENABLED: "1"
    # Public base URL used to build shareable result links (/r/<token>).
    APP_BASE_URL: "https://aidetect.co.actor"
    # Number of free trial checks granted per shared link.
    TRIAL_CHECK_LIMIT: "3"
    # Google OAuth client ID (public). Empty → Google sign-in stays disabled (no-op).
    # Audience the backend verifies ID tokens against; the same value is baked into
    # the SPA via the VITE_GOOGLE_CLIENT_ID build-arg (GitHub Actions secret).
    GOOGLE_OAUTH_CLIENT_ID: "225787295362-3eimoroafvlat8d2otfk5jl7ol5jjaap.apps.googleusercontent.com"
    # Comma-separated emails granted the admin role (seeded on startup + self-heal on login).
    ADMIN_EMAILS: "i.salmova@cccrafts.ai"
    # Sender for invitation emails (Resend-verified domain). Key is the KV secret below.
    EMAIL_FROM: "AIDetect <aidetect@email.co.actor>"
  # CSI-mounted secrets (Key Vault → secret-backend-env).
  # NOTE: DATABASE_URL and AUTH_JWT_SECRET MUST exist in Key Vault before deploying —
  # the app will not start without a database. KV secret name = aidetect-dev-backend-<KEY-WITH-HYPHENS>
  # (uppercase preserved). Create these KV secrets first:
  #   aidetect-dev-backend-DATABASE-URL     → postgresql+asyncpg://USER:PASS@HOST:5432/DB
  #   aidetect-dev-backend-AUTH-JWT-SECRET  → a long random string (>=32 chars)
  # Prod requires a MANAGED Postgres (e.g. Azure Database for PostgreSQL flexible server).
  # SQLite on an ephemeral pod loses all users/links/trial counters on restart — do not use it in AKS.
  secretEnvKeys:
    - OPENROUTER_API_KEY
    - RESEND_API_KEY
    - AIDETECT_INTERNAL_TOKEN
    - REDIS_URL
    - DATABASE_URL
    - AUTH_JWT_SECRET
    - LANGFUSE_PUBLIC_KEY
    - LANGFUSE_SECRET_KEY
    - LANGFUSE_HOST
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /v1/healthz
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /v1/healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

frontend:
  enabled: true
  name: frontend
  replicas: 1
  image:
    repository: aidetect-frontend
    tag: ""  # falls back to .Values.image.tag
  port: 80
  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 96Mi

ingress:
  enabled: true
  className: nginx
  clusterIssuer: letsencrypt-prod
  tlsSecretName: aidetect-dev-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  hosts:
    api: apiaidetect.co.actor
    app: aidetect.co.actor
