name: aidetect

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aidetect
      POSTGRES_PASSWORD: aidetect
      POSTGRES_DB: aidetect
    ports:
      # Host port is overridable to avoid clashing with another local Postgres,
      # e.g. POSTGRES_PORT=5433 docker compose up postgres. Containers always
      # reach it at postgres:5432 on the compose network regardless.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidetect"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://aidetect:aidetect@postgres:5432/aidetect
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AIDETECT_INTERNAL_TOKEN: ${AIDETECT_INTERNAL_TOKEN:-dev-token-change-me}
      AUTH_JWT_SECRET: dev-jwt-secret-change-me-please
      APP_BASE_URL: http://localhost:9000
      TRIAL_CHECK_LIMIT: "3"
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      ENVIRONMENT: development
      API_PORT: "8010"
    command: ["uvicorn", "aidetect.main:app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "8010:8010"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "9000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8010

volumes:
  pgdata:
