name: Deploy to AKS (development)

on:
  push:
    branches: [development]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/helm/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to deploy (backend,frontend) or "all"'
        default: 'all'
        required: true

permissions:
  id-token: write     # for Azure OIDC login
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}     # e.g. publoraacrdev.azurecr.io
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AKS_NAME: ${{ vars.AKS_NAME }}
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  HELM_RELEASE: ${{ vars.HELM_RELEASE }}
  BACKEND_UAMI_CLIENT_ID: ${{ vars.BACKEND_UAMI_CLIENT_ID }}
  API_HOST: ${{ vars.API_HOST }}
  APP_HOST: ${{ vars.APP_HOST }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: development
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: aidetect-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            changed: ${{ needs.detect-changes.outputs.backend }}
          - service: frontend
            image: aidetect-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            changed: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - name: Skip if not changed
        if: matrix.changed != 'true' && github.event_name == 'push'
        run: echo "No changes for ${{ matrix.service }}, skipping" && exit 0

      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'

      - name: Azure login (OIDC)
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: Set up Docker Buildx
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Build args (frontend only)
        if: (matrix.changed == 'true' || github.event_name == 'workflow_dispatch') && matrix.service == 'frontend'
        id: build_args
        env:
          VITE_DEFAULT_API_KEY: ${{ secrets.VITE_DEFAULT_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          echo "args<<EOF" >> $GITHUB_OUTPUT
          # Single-domain: empty base URL -> SPA calls relative /v1/* on its own origin (aidetect.co.actor),
          # which the ingress proxies to the backend. No cross-origin, no CORS dependency.
          echo "VITE_API_BASE_URL=" >> $GITHUB_OUTPUT
          echo "VITE_DEFAULT_API_KEY=${VITE_DEFAULT_API_KEY}" >> $GITHUB_OUTPUT
          # Google sign-in client ID (public). Empty secret -> Google button stays hidden (no-op).
          echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push image
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:dev-latest
          build-args: ${{ steps.build_args.outputs.args }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:buildcache,mode=max

  deploy:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials -n ${{ env.AKS_NAME }} -g ${{ env.AKS_RESOURCE_GROUP }} --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      # Per-service tags: a service gets the commit SHA only if it was (re)built this run;
      # otherwise it keeps dev-latest (its last successful build). Pinning both services to
      # the SHA breaks deploys when only one service changed — the other has no image at that SHA.
      - name: Resolve image tags
        id: tags
        run: |
          dispatch='${{ github.event_name }}'
          # SHA if the service was (re)built this run (its dir changed, or a manual dispatch
          # rebuilds everything), otherwise dev-latest (its last successful build).
          tag() { if [ "$1" = "true" ] || [ "$dispatch" = "workflow_dispatch" ]; then echo "${{ github.sha }}"; else echo "dev-latest"; fi; }
          echo "backend=$(tag '${{ needs.detect-changes.outputs.backend }}')" >> $GITHUB_OUTPUT
          echo "frontend=$(tag '${{ needs.detect-changes.outputs.frontend }}')" >> $GITHUB_OUTPUT

      - name: Helm upgrade --install
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} \
            ./infra/helm/aidetect \
            --namespace ${{ env.K8S_NAMESPACE }} \
            -f ./infra/helm/aidetect/values-dev.yaml \
            --set image.registry=${{ env.ACR_LOGIN_SERVER }} \
            --set backend.image.tag=${{ steps.tags.outputs.backend }} \
            --set frontend.image.tag=${{ steps.tags.outputs.frontend }} \
            --set azure.backendUamiClientId=${{ env.BACKEND_UAMI_CLIENT_ID }} \
            --set ingress.hosts.api=${{ env.API_HOST }} \
            --set ingress.hosts.app=${{ env.APP_HOST }} \
            --wait --timeout 5m

      - name: Smoke check
        run: |
          kubectl get deploy,svc,ingress -n ${{ env.K8S_NAMESPACE }} -l app.kubernetes.io/instance=${{ env.HELM_RELEASE }}
          kubectl rollout status -n ${{ env.K8S_NAMESPACE }} deployment/${{ env.HELM_RELEASE }}-backend --timeout=5m
          kubectl rollout status -n ${{ env.K8S_NAMESPACE }} deployment/${{ env.HELM_RELEASE }}-frontend --timeout=5m
