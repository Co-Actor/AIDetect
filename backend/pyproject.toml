[project]
name = "aidetect"
version = "0.1.0"
description = "Multi-signal AI text detector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "python-multipart>=0.0.20",
  "structlog>=24.4",
  "tenacity>=9.0",
  "langdetect>=1.0.9",
  "regex>=2024.11.6",
  "asyncpg>=0.30",
  "langfuse>=2.50,<3.0",
  "sqlalchemy[asyncio]>=2.0",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "google-auth>=2.35",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml>=6.0.12",
]
calibration = [
  "polars>=1.17",
  "scikit-learn>=1.5",
  "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidetect"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langdetect.*", "asyncpg.*", "langfuse.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
]
