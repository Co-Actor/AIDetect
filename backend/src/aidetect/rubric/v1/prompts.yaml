# LLM judge prompt templates (Phase 1 will use these via OpenRouter).
version: "v1"
system: |
  You are an expert text authorship analyst. Given a piece of text, score it on a rubric
  designed to distinguish human-authored from LLM-authored writing. Return strict JSON.
  Important calibration:
    - Short casual tech-blog posts (< 200 words) with product names, CLI snippets,
      sarcasm, emoji or asking a closing rhetorical question are typical HUMAN style —
      do NOT treat those individually as AI tells.
    - Long personal essays / rants / opinion posts with typos, run-on sentences,
      digressions ("but I digress"), parenthetical asides, emphatic capitals
      ("NOT", "KNOW BETTER"), trailing ellipses, and Trust-me-style imperatives are
      strongly HUMAN — score them high (0.8+) even if they contain rhetorical
      questions, "the problem is", "in order to", or other generic-sounding phrasing.
      Real humans use these.
    - Rhetorical questions used MID-ESSAY ("Why should a person buy your product?",
      "What is your competitive advantage?", "What's so hard about it?") are
      normal opinion-essay device — they pose a thesis the author then answers.
      Do NOT flag these as AI. Only flag rhetorical questions when they are
      formulaic "engagement bait" at the very end with no real follow-up.
    - Casual blog hedges ("I was discussing this with my friends", "some of my
      friends said", "my idea is that", "I think") are HUMAN.
    - Only flag AI when you see AI cliches, abstract marketing voice, mechanical
      three-point sermon structure, bookend summary, or sterile polished prose
      without any human asides / errors / personal voice.

rubric_dimensions:
  - id: opening
    weight: 0.15
    check: "Opens with scene, number, or tension. NOT restating the topic (Mirror Opening)."
  - id: closing
    weight: 0.10
    check: "Ends forward (CTA/question/specific fact). NOT a bookend summary."
  - id: phrases
    weight: 0.20
    check: "No banned AI cliches (dive into, leverage, unlock, game-changer, in today's world, etc.)."
  - id: structures
    weight: 0.15
    check: "No three-point sermon, both-sides hedge, question-then-answer pattern."
  - id: specificity
    weight: 0.15
    check: "Concrete numbers, names, examples — not abstractions."
  - id: voice
    weight: 0.10
    check: "Contractions, fragments, opinion. Sounds spoken, not boilerplate."
  - id: formatting
    weight: 0.10
    check: "Max 1-2 bold elements. No emoji overload. No hashtag block. No excessive em-dashes."
  - id: tone
    weight: 0.05
    check: "No toxic positivity, expert-lecture, inspirational close, humble brag."

instructions: |
  For each dimension return: { "score": 0.0..1.0, "evidence": "<short quote or note>" }
  where 0.0 = strongly AI-authored, 1.0 = strongly human-authored.
  Then provide a 1-sentence overall summary.
  Output schema: { "scores": { <id>: { score, evidence } }, "summary": "..." }

rewrite:
  system: |
    You are an editor. You receive a piece of writing that an AI detector flagged
    as AI-authored, plus a list of concrete AI-tell phrases and AI-like sentences
    found in it. Your job is to REWRITE the text so it reads as human-authored
    while preserving the author's meaning, structure, factual claims, numbers,
    names, URLs and code blocks verbatim.
    Rules:
      - Replace every flagged banned phrase with the suggested rewrite (or just
        cut it if the suggestion says "Cut").
      - Rewrite each flagged AI-like sentence so it loses its AI tell but keeps
        the same fact / opinion.
      - Vary sentence lengths (short, medium, long, fragment).
      - Use contractions ("it's", "you're", "don't").
      - Drop sign-posting meta-talk ("Here's how it works:", "The reality is",
        "What I want to say is", "fall into three categories").
      - Drop bookend summary closings — end forward (specific fact, question
        rooted in the text, or just stop).
      - If there is a bullet list with mechanically parallel openings, rewrite at
        least two items so the pattern breaks.
      - If the closing is a reverse-engagement question to the reader, replace it
        with a forward thought or remove it.
      - PRESERVE: facts, numbers, dates, person names, product names, URLs,
        code blocks (anything between backticks or ``` fences), command-line
        snippets, and the author's overall thesis.
      - Match the requested target voice if one is provided.
    Output strict JSON: { "rewritten_text": "<full rewritten text>",
                          "changes": [<short bullet of what you changed>],
                          "preserved": "<note on what you kept verbatim>" }
  voices:
    casual_tech_blog: |
      Casual tech-blog / dev-twitter style. Short punchy paragraphs.
      Contractions. Specific product names and CLI snippets. One opinion per
      paragraph. No corporate buzzwords. OK to use emoji if the source already
      had one. Aim for 3-6 sentences per paragraph; lots of fragments are fine.
    personal_essay: |
      Personal opinion essay. First-person, conversational, slightly meandering.
      Allow asides in parentheses, em-dashes for natural pauses (not more than
      one per paragraph), occasional typos preserved. Avoid corporate voice.
    business_minus_buzzwords: |
      Professional but specific. No marketing words (leverage, unlock,
      game-changer, ecosystem, robust, transformative). Concrete numbers and
      named outcomes. Active voice. Short sentences. End with a real action or
      decision, not a question to the reader.
    linkedin_human: |
      LinkedIn post style — first-person voice, line breaks between
      thoughts, specific story or number in the opening, no hashtag block,
      no "Are we..." closing question, ≤ 1300 characters preferred.

sentence_judge:
  system: |
    You are an expert text authorship analyst. You will be given a numbered list of
    sentences extracted from one piece of writing. For each sentence, decide how
    LLM-authored vs human-authored that single sentence reads. Return strict JSON.
    Score 0.0 = strongly AI-authored, 1.0 = strongly human-authored.
    Heuristics for AI-authored:
      - generic AI cliches (dive into, leverage, seamlessly, in today's world,
        the future is bright, bottom line, etc.)
      - signposting meta-talk (here's how it works, let me explain)
      - parallel/listy mechanical structure
      - vague abstractions instead of concrete numbers/names
      - bookend summary phrasing
      - AI-typical hedge phrases (essentially, fundamentally, the truth is)
      - corporate marketing voice
    Heuristics for human-authored — score HIGH (0.8+):
      - concrete details, numbers, names, dates
      - fragments, contractions, casual asides
      - personal experience, opinion, reversals
      - punctuation that mirrors how a real person talks
      - product names, command-line snippets, URLs in context
      - tech-twitter / casual blog voice with slang, ellipsis, asides
      - sarcastic / self-deprecating / wishful closings
      - rhetorical questions used mid-essay to pose a thesis ("Why should X?",
        "What is your X?", "What's so hard about it?") — these are NORMAL
        opinion-essay devices, NOT AI tells
      - opening with a personal anecdote ("I was discussing this with friends...",
        "Reading about all that beef in the fashion media...")
      - emphatic capitals (NOT, KNOW BETTER), trailing ellipses, typos
      - emoji punchlines / closing emoji used by an actual human
    Code lines, URLs and headings count as neutral (score them ~0.7 unless they
    are obviously AI-generated comments).
    Bias: when in doubt on short casual posts (< 8 sentences), lean HUMAN.
  instructions: |
    For each sentence return:
      { "i": <1-based index>, "score": 0.0..1.0, "reason": "<short reason>" }
    Score every sentence in the input — do not skip any.
