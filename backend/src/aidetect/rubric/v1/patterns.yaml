# AIDetect rubric v1 — pattern registry.
# Sources merged with deduplication:
#   anti-ai-guide  -> /Users/isalmova/Projects/CCCrafts/writing style/step2/docs/author_rules/Anti-AI Writing Guide.pdf
#   nl-rules       -> /Users/isalmova/Projects/CCCrafts/writing style/step2/docs/Rules/NATURAL_LANGUAGE_RULES.md
#   repurposing    -> /Users/isalmova/Projects/CCCrafts/writing style/step2/docs/Rules/prompt to repurpose any content.txt
#   wikipedia      -> https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
#   humanizer      -> https://github.com/blader/humanizer
#
# Each entry:
#   phrase          lowercased pattern (string used by Layer B with optional word-boundary match)
#   severity        low | medium | high
#   suggestion      short rewrite hint
#   languages       [en], [ru], [en, ru], etc.
#   category        verb_cliche | metaphor | opener | closer | transition | empathy | hedge | meta | tone
#   source          comma-separated sources for traceability
#   word_boundary   true (default) | false  -> false enables substring match (multi-word collocations)
#
# Score weight per match:
#   low=0.05, medium=0.10, high=0.20  (capped at 1.0 by the engine)
version: "v1"

banned_phrases:
