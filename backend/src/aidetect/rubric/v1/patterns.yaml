  - { phrase: "it turns out that", severity: low, suggestion: "Cut — say the fact.",             languages: [en], category: hedge,     source: "humanizer" }
  - { phrase: "as it happens",     severity: low, suggestion: "Cut.",                            languages: [en], category: hedge,     source: "humanizer" }
  - { phrase: "more often than not", severity: low, suggestion: "'Usually' or be specific.",     languages: [en], category: hedge,     source: "humanizer" }
  - { phrase: "to put it simply",  severity: low, suggestion: "Cut. Just be simple.",            languages: [en], category: meta,      source: "humanizer" }
  - { phrase: "in a nutshell",     severity: medium, suggestion: "Cut.",                         languages: [en], category: meta,      source: "humanizer" }
  - { phrase: "the bottom line is", severity: medium, suggestion: "Just state it.",              languages: [en], category: closer,    source: "humanizer" }
  - { phrase: "the truth is",      severity: medium, suggestion: "Just state your opinion.",     languages: [en], category: hedge,     source: "humanizer" }
  - { phrase: "the fact is",       severity: medium, suggestion: "State the fact directly.",     languages: [en], category: hedge,     source: "humanizer" }
  - { phrase: "by all accounts",   severity: low, suggestion: "Cite the account.",               languages: [en], category: hedge,     source: "wikipedia" }
  - { phrase: "let's break it down", severity: medium, suggestion: "Just break it down.",        languages: [en], category: meta,      source: "humanizer" }
  - { phrase: "let me explain",    severity: medium, suggestion: "Just explain.",                languages: [en], category: meta,      source: "humanizer" }
  - { phrase: "stay tuned",        severity: low, suggestion: "Be specific about what's coming.",languages: [en], category: meta,      source: "humanizer" }
  - { phrase: "imagine if",        severity: low, suggestion: "Describe a real scenario.",       languages: [en], category: opener,    source: "wikipedia" }
  - { phrase: "picture this",      severity: low, suggestion: "Just show the scene.",            languages: [en], category: opener,    source: "humanizer" }

  # === engagement bait (en) ===
  - { phrase: "happy to discuss",  severity: medium, suggestion: "Cut or be specific.",          languages: [en], category: meta, source: "humanizer" }
  - { phrase: "drop a comment",    severity: medium, suggestion: "Ask a real question.",         languages: [en], category: meta, source: "humanizer" }
  - { phrase: "share your thoughts", severity: medium, suggestion: "Ask something specific.",    languages: [en], category: meta, source: "humanizer" }
  - { phrase: "let's connect",     severity: medium, suggestion: "Cut.",                         languages: [en], category: meta, source: "humanizer" }
  - { phrase: "feel free to reach out", severity: medium, suggestion: "Cut.",                    languages: [en], category: meta, source: "humanizer" }
  - { phrase: "let me know what you think", severity: high, suggestion: "Cut or ask a specific question.", languages: [en], category: meta, source: "humanizer" }
  - { phrase: "would love to hear", severity: medium, suggestion: "Cut.",                        languages: [en], category: meta, source: "humanizer" }

  # === soft markers (ru) ===
  - { phrase: "по сути",           severity: low, suggestion: "Удалить.",                        languages: [ru], category: hedge,    source: "nl-rules" }
  - { phrase: "по факту",          severity: low, suggestion: "Удалить.",                        languages: [ru], category: hedge,    source: "nl-rules" }
  - { phrase: "честно говоря",     severity: low, suggestion: "Удалить или конкретно.",          languages: [ru], category: hedge,    source: "nl-rules" }
  - { phrase: "правда в том",      severity: medium, suggestion: "Сразу к факту.",                languages: [ru], category: hedge,    source: "nl-rules" }
  - { phrase: "дело в том",        severity: low, suggestion: "Удалить.",                        languages: [ru], category: hedge,    source: "nl-rules" }
  - { phrase: "если разобраться",  severity: low, suggestion: "Удалить.",                        languages: [ru], category: meta,     source: "nl-rules" }
  - { phrase: "если копнуть глубже", severity: medium, suggestion: "Сразу к фактам.",            languages: [ru], category: meta,     source: "nl-rules" }
  - { phrase: "стоит сказать",     severity: low, suggestion: "Просто скажите.",                  languages: [ru], category: transition, source: "nl-rules" }
  - { phrase: "стоит упомянуть",   severity: low, suggestion: "Просто упомяните.",                languages: [ru], category: transition, source: "nl-rules" }
  - { phrase: "представьте себе",  severity: low, suggestion: "Покажите конкретно.",              languages: [ru], category: opener,   source: "nl-rules" }

  # === engagement bait (ru) ===
  - { phrase: "поделитесь в комментариях", severity: medium, suggestion: "Задайте конкретный вопрос.", languages: [ru], category: meta, source: "nl-rules" }
  - { phrase: "напишите в комментариях",   severity: medium, suggestion: "Задайте конкретный вопрос.", languages: [ru], category: meta, source: "nl-rules" }
  - { phrase: "буду рад обсудить",         severity: medium, suggestion: "Удалить.",                    languages: [ru], category: meta, source: "nl-rules" }
  - { phrase: "что вы думаете",            severity: low, suggestion: "Конкретный вопрос лучше.",       languages: [ru], category: meta, source: "nl-rules" }

structures:
  - id: bookend_summary
    description: "Final paragraph restates everything just said."
    severity: medium
    detection:
      type: regex_in_tail
      tail_chars: 280
      patterns:
        - "(?i)\\bin conclusion\\b"
        - "(?i)\\bto summari[sz]e\\b"
        - "(?i)\\bin summary\\b"
        - "(?i)\\bto wrap (?:up|things up)\\b"
        - "(?i)\\bto recap\\b"
        - "(?i)в заключение"
        - "(?i)подведём итог"
        - "(?i)резюмиру[яе]"
    source: "anti-ai-guide"

  - id: excessive_bold_md
    description: "Mechanical markdown bolding (>3 ** spans)."
    severity: low
    detection:
      type: count_threshold
      counter: bold_md
      threshold: 3
    source: "anti-ai-guide"

  - id: emoji_overload
    description: "Decorative emoji on most lines (>5)."
    severity: low
    detection:
      type: count_threshold
      counter: emoji
      threshold: 5
    source: "anti-ai-guide"

  - id: em_dash_overuse
    description: "Many U+2014 em-dashes (>5) — strong AI tell."
    severity: medium
    detection:
      type: count_threshold
      counter: emdash
      threshold: 5
    source: "anti-ai-guide,wikipedia"

  - id: hashtag_block
    description: "Five or more hashtags clustered at the post end."
    severity: low
    detection:
      type: count_threshold
      counter: hashtag
      threshold: 5
    source: "anti-ai-guide"

  - id: unicode_bold_chars
    description: "Unicode Mathematical Alphanumeric Symbols used to fake bold."
    severity: high
    detection:
      type: regex_present
      patterns:
        - "[\\U0001d400-\\U0001d7ff]"
    source: "co-actor M6"

  - id: signposting_announcement
    description: "Meta-announcement instead of just delivering the content."
    severity: medium
    detection:
      type: regex_present
      patterns:
        - "(?im)\\bhere'?s how (?:it|this) works\\b"
        - "(?im)\\bhere'?s the thing\\b"
        - "(?im)\\bhere'?s why\\b"
        - "(?im)\\bhere'?s what\\b"
        - "(?im)\\bhere'?s the deal\\b"
        - "(?im)\\blet me explain\\b"
        - "(?im)\\blet'?s break (?:this|that|it) down\\b"
        - "(?im)\\bhere'?s a quick (?:rundown|breakdown|overview)\\b"
        - "(?im)\\bвот как (?:это|оно) работает\\b"
        - "(?im)\\bдавайте разберём\\b"
        - "(?im)\\bпозвольте объяснить\\b"
    source: "anti-ai-guide,humanizer"

  - id: negative_parallelism
    description: "Negative-parallel construction: 'It's not X, it's Y' / 'I don't think X — it's Y'."
    severity: medium
    detection:
      type: regex_present
      patterns:
        - "(?im)\\bit'?s not\\b[^.\\n]{0,80}[—–-]\\s*it'?s\\b"
        - "(?im)\\bnot just\\b[^,.\\n]{0,40},\\s*but\\b"
        - "(?im)\\bi don'?t think it'?s\\b[^.\\n]{0,80}[—–-]\\s*it'?s\\b"
        - "(?im)\\bthis isn'?t (?:about|just)\\b[^.\\n]{0,80}\\bit'?s (?:about|really)\\b"
        - "(?im)это не\\b[^.\\n]{0,80}[—–-]\\s*это"
        - "(?im)не просто\\b[^,.\\n]{0,40},\\s*а\\b"
    source: "wikipedia,humanizer"

  - id: reverse_engagement_close
    description: "Closing the post with a generic question to the reader."
    severity: medium
    detection:
      type: regex_in_last_sentence
      patterns:
        - "^(?:Do you|Have you|What'?s your|What do you think|What about|How do you|How would you|Would you|Are you|Are we|Should we|Could we|Aren'?t we|Have we)"
        - "^(?:А вы|Что вы (?:думаете|об этом|скажете)|Как вы|А что вы)"
    source: "humanizer"

  - id: parallel_bullet_list
    description: "Three or more bullet items with parallel openings (e.g. 'Default state:' / 'Hover state:' / 'Dark mode:')."
    severity: medium
    detection:
      type: parallel_bullets
      min_items: 3
    source: "anti-ai-guide"
